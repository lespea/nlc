[package]
name = "nlc"
version = "0.2.0"
authors = ["Adam Lesperance <lespea@gmail.com>"]
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num-format = "0.4"
pulp = { version = "0.22", features = ["macro"] }

[profile.release]
lto = true
codegen-units = 1
debug = false
panic = "abort"
